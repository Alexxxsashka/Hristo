# Mutations for Data Connect

# User Profile
mutation CreateUserProfile($id: String!, $email: String!, $role: String!) {
  userProfile_insert(data: {
    id: $id,
    email: $email,
    role: $role
  })
}

mutation UpdateUserProfile($id: String!, $data: UserProfile_update_input!) {
  userProfile_update(id: $id, data: $data)
}

# Orders
mutation CreateOrder($id: String!, $orderNumber: String!, $userId: String!, $total: Float!, $status: String!) {
  order_insert(data: {
    id: $id,
    orderNumber: $orderNumber,
    userId: $userId,
    total: $total,
    status: $status,
    subtotal: $total,
    tax: 0,
    shippingCost: 0,
    profit: 0
  })
}

# Products (Admin)
mutation UpsertProduct($id: String!, $data: Product_insert_input!) {
  product_upsert(data: $data)
}
