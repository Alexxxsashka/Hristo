# Queries for Data Connect

# Products
query GetProducts($category: String, $type: String) {
  products(where: {
    category: { eq: $category },
    type: { eq: $type }
  }) {
    id
    name
    price
    image
    category
    type
    stock
    slug
  }
}

query GetProduct($id: String!) {
  product(id: $id) {
    id
    name
    description
    price
    image
    category
    type
    stock
    slug
    model3D
    brand
    model
  }
}

# Categories
query GetCategories {
  categories {
    id
    name
    slug
    image
    parent
  }
}

# User Profile
query GetUserProfile($id: String!) {
  userProfile(id: $id) {
    id
    email
    username
    displayName
    role
    points
    rank
  }
}

# Blog
query GetBlogPosts($category: String) {
  blogPosts(where: { category: { eq: $category } }, orderBy: [{ date: DESC }]) {
    id
    title
    slug
    image
    excerpt
    date
    category
  }
}
